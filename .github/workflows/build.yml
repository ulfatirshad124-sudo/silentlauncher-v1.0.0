name: Build SilentLauncher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        shell: pwsh
        run: Expand-Archive -Path SilentLauncher.zip -DestinationPath src -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: >
          dotnet publish src/SilentLauncher/SilentLauncher/SilentLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: SilentLauncher
          path: publish/SilentLauncher.exe
